# Host-side HTTP/HTTPS proxy for apple/container guests.
# Only needed where the vmnet NAT path has no external TCP egress (see
# docs/NETWORK.md). Guest -> host TCP still works, so guests reach the internet
# through this. Copy to ~/.config/cc-container/tinyproxy.conf.

Port 8888
Timeout 600

Allow 127.0.0.1
# Narrow this if your bridge subnet is shared with anything you do not control:
# every host on it can use this proxy while it is running.
Allow 192.168.64.0/24

# CONNECT targets: 443 for HTTPS/git, 22 for ssh-over-proxy if ever needed
ConnectPort 443
ConnectPort 22

MaxClients 100

LogLevel Warning
DisableViaHeader Yes
